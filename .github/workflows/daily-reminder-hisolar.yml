name: Hi Solar — Daily LINE Reminder (Hi Solar)

on:
  schedule:
    # 06:00 Asia/Bangkok = 23:00 UTC (previous day)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'วันที่ต้องการดึง (YYYY-MM-DD) — เว้นว่างเพื่อใช้วันนี้'
        required: false
        default: ''

jobs:
  send-reminder:
    name: Fetch Calendar & Notify LINE (Hi Solar)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily reminder
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:   ${{ secrets.SUPABASE_ANON_KEY }}
          LINE_CHANNEL_TOKEN:  ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:       ${{ secrets.LINE_GROUP_ID_HISOLAR }}
          DATE_OVERRIDE:       ${{ github.event.inputs.date_override }}
        run: node scripts/daily-reminder.js
