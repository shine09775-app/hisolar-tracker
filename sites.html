<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hi Solar">
  <title>Hi Solar — ทะเบียนลูกค้า</title>

  <link rel="icon" type="image/png" href="icon_hisolar.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    :root {
      --hs-primary:   #16a34a;
      --hs-primary-d: #15803d;
      --hs-primary-l: #dcfce7;
      --hs-amber:     #f59e0b;
      --hs-amber-l:   #fef3c7;
      --hs-blue:      #3b82f6;
      --hs-blue-l:    #dbeafe;
      --hs-red:       #ef4444;
      --hs-red-l:     #fee2e2;
      --nav-h:        62px;
      --bs-primary:        #16a34a;
      --bs-primary-rgb:    22,163,74;
    }
    * { font-family: 'Kanit', system-ui, sans-serif; }
    body { background: #f1f5f9; }

    .btn-primary { background-color: var(--hs-primary); border-color: var(--hs-primary); }
    .btn-primary:hover { background-color: var(--hs-primary-d); border-color: var(--hs-primary-d); }
    .text-primary { color: var(--hs-primary) !important; }

    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #f1f5f9; }
    @media (min-width: 576px) { #app { box-shadow: 0 0 40px rgba(0,0,0,.15); } }

    /* Navbar */
    .hs-navbar {
      background: var(--hs-primary); padding: 12px 16px;
      position: sticky; top: 0; z-index: 90;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hs-navbar .brand { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 17px; font-weight: 700; }
    .hs-navbar .brand-sub { font-size: 12px; font-weight: 400; opacity: .85; }
    .auth-actions { display: flex; align-items: center; gap: 8px; }
    .user-chip {
      background: rgba(255,255,255,.18); color: #fff; border-radius: 999px;
      padding: 4px 10px; font-size: 12px; max-width: 120px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .icon-btn {
      background: rgba(255,255,255,.18); border: 0; color: #fff; text-decoration: none;
      width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 auto;
    }

    /* Summary strip */
    .summary { padding: 12px 14px 4px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sum-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 8px; text-align: center; }
    .sum-card .v { font-size: 18px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .sum-card .l { font-size: 10.5px; color: #64748b; margin-top: 2px; }

    /* Overview panel */
    .ov { margin: 8px 14px 0; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
    .ov-head {
      width: 100%; border: 0; background: #fff; display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; font-size: 13px; font-weight: 600; color: #334155; cursor: pointer;
    }
    .ov-head .bi-bar-chart-line-fill { color: var(--hs-primary); }
    .ov-head .sp { flex: 1; text-align: left; }
    .ov-head .hint { font-size: 10.5px; font-weight: 400; color: #94a3b8; }
    .ov-head .chev { transition: transform .18s ease; color: #94a3b8; }
    .ov.open .ov-head .chev { transform: rotate(180deg); }
    .ov-body { display: none; padding: 2px 12px 12px; border-top: 1px solid #f1f5f9; }
    .ov.open .ov-body { display: block; }

    .ch { padding: 10px 0 2px; border-top: 1px solid #f1f5f9; }
    .ch:first-child { border-top: 0; }
    .ch-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .ch-t { font-size: 12px; font-weight: 600; color: #475569; flex: 1; }
    .ch-sub { font-size: 10px; color: #94a3b8; }
    .metric-tog { display: flex; gap: 0; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    .metric-tog button {
      border: 0; background: #fff; color: #64748b; font-size: 10.5px; font-weight: 500;
      padding: 3px 8px; cursor: pointer;
    }
    .metric-tog button.on { background: var(--hs-primary); color: #fff; }

    /* Column (year) chart */
    .cols { display: flex; align-items: flex-end; gap: 4px; height: 108px; }
    .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .col .stack {
      width: 100%; display: flex; flex-direction: column; justify-content: flex-end;
      border-radius: 5px 5px 0 0; overflow: hidden; transition: opacity .15s ease;
    }
    .col .seg { width: 100%; }
    .col.dim .stack { opacity: .28; }
    .col .cv { font-size: 10px; font-weight: 700; color: #334155; font-variant-numeric: tabular-nums; margin-bottom: 3px; }
    .col .cl { font-size: 9px; color: #94a3b8; margin-top: 4px; white-space: nowrap; }
    .col.on .cl { color: var(--hs-primary); font-weight: 600; }

    /* Segmented + bar charts */
    .segbar { display: flex; height: 22px; border-radius: 7px; overflow: hidden; background: #f1f5f9; }
    .segbar .s { display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; cursor: pointer; min-width: 0; }
    .segbar .s.dim { opacity: .3; }
    .seg-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; }
    .lg { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: #64748b; cursor: pointer; background: none; border: 0; padding: 0; }
    .lg .sw { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
    .lg.on { color: #334155; font-weight: 600; }
    .lg b { font-weight: 600; color: #334155; font-variant-numeric: tabular-nums; }

    .hbars { display: flex; flex-direction: column; gap: 7px; }
    .hb { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .hb .hb-l { font-size: 11px; color: #475569; width: 58px; flex: 0 0 auto; }
    .hb .hb-track { flex: 1; height: 15px; background: #f1f5f9; border-radius: 5px; overflow: hidden; }
    .hb .hb-fill { height: 100%; border-radius: 5px; transition: width .2s ease; }
    .hb .hb-v { font-size: 10.5px; font-weight: 600; color: #334155; font-variant-numeric: tabular-nums; width: 62px; text-align: right; flex: 0 0 auto; }
    .hb.dim { opacity: .4; }

    .ch-note { font-size: 10px; color: #94a3b8; margin-top: 8px; line-height: 1.45; }

    /* Warranty pill on cards */
    .wpill { font-size: 9.5px; font-weight: 600; padding: 2px 6px; border-radius: 5px; white-space: nowrap; }
    .w-active  { background: var(--hs-primary-l); color: #15803d; }
    .w-soon    { background: var(--hs-amber-l);   color: #a16207; }
    .w-expired { background: #f1f5f9;             color: #64748b; }
    .w-due     { background: var(--hs-red-l);     color: #b91c1c; }

    /* Active filter bar */
    .active-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0 0; }
    .afc {
      display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500;
      background: var(--hs-primary); color: #fff; border: 0; border-radius: 999px; padding: 4px 8px 4px 10px; cursor: pointer;
    }
    .afc i { font-size: 12px; opacity: .85; }

    /* Search + filters */
    .toolbar { padding: 10px 14px 6px; position: sticky; top: var(--nav-h); background: #f1f5f9; z-index: 80; }
    .search-wrap { position: relative; }
    .search-wrap .bi-search { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
    .search-wrap input {
      width: 100%; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 10px 34px 10px 34px; font-size: 14px; background: #fff;
    }
    .search-wrap input:focus { outline: 2px solid var(--hs-primary-l); border-color: var(--hs-primary); }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      border: 0; background: transparent; color: #94a3b8; padding: 4px;
    }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; font-size: 12px; font-weight: 500; border: 1px solid #e2e8f0;
      background: #fff; color: #475569; border-radius: 999px; padding: 5px 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .chip.on { background: var(--hs-primary); border-color: var(--hs-primary); color: #fff; }
    .chip .cnt { opacity: .7; font-size: 11px; }
    .result-line { font-size: 12px; color: #64748b; padding: 4px 2px 0; }

    /* Site cards */
    .list { padding: 6px 14px 90px; }
    .site-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
      padding: 12px; margin-bottom: 10px; cursor: pointer;
    }
    .site-card:active { transform: scale(.995); }
    .site-card .top { display: flex; align-items: flex-start; gap: 8px; }
    .site-card .nm { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; line-height: 1.25; }
    .site-card .addr {
      font-size: 11.5px; color: #64748b; margin-top: 3px;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .site-card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
    .kwp { font-size: 12.5px; font-weight: 600; color: var(--hs-primary); font-variant-numeric: tabular-nums; }
    .badge-brand { font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 6px; letter-spacing: .02em; }
    .b-HUAWEI   { background: #fee2e2; color: #b91c1c; }
    .b-DEYE     { background: #dbeafe; color: #1d4ed8; }
    .b-SOLIS    { background: #dcfce7; color: #15803d; }
    .b-FELICITY { background: #fef3c7; color: #a16207; }
    .b-GROWATT  { background: #ede9fe; color: #6d28d9; }
    .b-ENERGYLIB{ background: #ccfbf1; color: #0f766e; }
    .b-none     { background: #f1f5f9; color: #64748b; }
    .status-pill { font-size: 10.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; color: #64748b; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; }
    .dot.online { background: #22c55e; }
    .dot.offline { background: #94a3b8; }
    .dot.fault   { background: var(--hs-red); }

    .empty { text-align: center; padding: 48px 20px; color: #94a3b8; }
    .empty i { font-size: 40px; display: block; margin-bottom: 10px; opacity: .6; }

    /* Detail sheet */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 1040;
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-backdrop.show { display: flex; }
    .sheet {
      background: #f8fafc; width: 100%; max-width: 480px; max-height: 92vh;
      border-radius: 18px 18px 0 0; overflow-y: auto; animation: slideUp .22s ease;
    }
    @keyframes slideUp { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
    .sheet-hero { background: linear-gradient(150deg, var(--hs-primary), var(--hs-primary-d)); color: #fff; padding: 14px 16px 16px; }
    .sheet-hero .row1 { display: flex; align-items: center; justify-content: space-between; }
    .sheet-hero h2 { font-size: 18px; font-weight: 600; margin: 10px 0 3px; line-height: 1.2; }
    .sheet-hero .loc { font-size: 12px; opacity: .9; }
    .hero-stats { display: flex; gap: 18px; margin-top: 12px; }
    .hero-stats .hv { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
    .hero-stats .hl { font-size: 10.5px; opacity: .82; margin-top: 3px; }
    .sheet-body { padding: 14px; }
    .act-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .act {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px; border-radius: 11px; font-size: 12.5px; font-weight: 600;
      border: 1px solid #e2e8f0; background: #fff; color: #334155; text-decoration: none;
    }
    .act.pri { background: var(--hs-primary); border-color: var(--hs-primary); color: #fff; }
    .act.map { background: var(--hs-amber); border-color: var(--hs-amber); color: #422006; }
    .act.disabled { opacity: .45; pointer-events: none; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 4px 12px; margin-bottom: 12px; }
    .panel h6 { font-size: 12px; font-weight: 600; color: #64748b; margin: 12px 0 6px; }
    .field { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid #f1f5f9; font-size: 13px; }
    .field:first-of-type { border-top: 0; }
    .field .fl { color: #64748b; width: 92px; flex: 0 0 auto; font-size: 12px; }
    .field .fv { font-weight: 500; flex: 1; word-break: break-word; }
    .field .fv a { color: var(--hs-primary); text-decoration: none; }
    /* Inline edit form */
    .panel-head { display: flex; align-items: center; gap: 8px; padding: 10px 0 4px; }
    .panel-head h6 { margin: 0; flex: 1; }
    .btn-edit {
      border: 1px solid var(--hs-primary); background: #fff; color: var(--hs-primary);
      font-size: 11.5px; font-weight: 600; border-radius: 8px; padding: 4px 10px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .ef { padding: 8px 0; border-top: 1px solid #f1f5f9; }
    .ef:first-of-type { border-top: 0; }
    .ef label { display: block; font-size: 11px; color: #64748b; margin-bottom: 4px; }
    .ef input, .ef textarea {
      width: 100%; border: 1px solid #e2e8f0; border-radius: 9px;
      padding: 8px 10px; font-size: 13.5px; background: #fff; font-family: inherit;
    }
    .ef input:focus, .ef textarea:focus { outline: 2px solid var(--hs-primary-l); border-color: var(--hs-primary); }
    .ef textarea { resize: vertical; min-height: 58px; }
    .ef .hint, .field .hint { font-size: 10px; color: #94a3b8; margin-top: 3px; line-height: 1.45; }
    .field .hint a { color: var(--hs-primary); }
    .edit-actions { display: flex; gap: 8px; padding: 12px 0 4px; }
    .edit-actions button { flex: 1; border-radius: 10px; padding: 9px; font-size: 13px; font-weight: 600; border: 1px solid #e2e8f0; }
    .edit-actions .save { background: var(--hs-primary); border-color: var(--hs-primary); color: #fff; }
    .edit-actions .cancel { background: #fff; color: #475569; }
    .edit-actions button[disabled] { opacity: .6; }
    .edit-msg { font-size: 11.5px; padding: 8px 10px; border-radius: 9px; margin-top: 8px; display: none; }
    .edit-msg.err { display: block; background: var(--hs-red-l); color: #b91c1c; }
    .edit-msg.ok  { display: block; background: var(--hs-primary-l); color: #15803d; }

    /* Deye Cloud sync sheet */
    .sync-counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
    .sync-count { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 11px; padding: 9px 6px; text-align: center; }
    .sync-count .v { font-size: 19px; font-weight: 700; line-height: 1.1; }
    .sync-count .l { font-size: 10.5px; color: #64748b; margin-top: 2px; }
    .sync-count.new .v { color: var(--hs-primary); }
    .sync-count.dup .v { color: #d97706; }
    .sync-list { max-height: 210px; overflow-y: auto; margin-top: 4px; }
    .sync-item { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid #f1f5f9; font-size: 12.5px; }
    .sync-item:first-child { border-top: 0; }
    .sync-item b { font-weight: 600; flex: 1; min-width: 0; word-break: break-word; }
    .sync-item span { font-size: 11px; color: #64748b; flex: 0 0 auto; }
    .sync-note { font-size: 11.5px; color: #64748b; line-height: 1.5; margin-top: 6px; }
    .sync-spin { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #475569; padding: 18px 0; }

    .jobs-empty { font-size: 12px; color: #94a3b8; padding: 10px 0; }
    .job-row { display: flex; gap: 9px; padding: 9px 0; border-top: 1px solid #f1f5f9; }
    .job-row:first-of-type { border-top: 0; }
    .job-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; font-size: 14px; }
    .job-t { flex: 1; min-width: 0; }
    .job-t b { font-size: 12.5px; font-weight: 600; display: block; }
    .job-t span { font-size: 11px; color: #64748b; }

    /* Auth gate */
    .name-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 1080;
      align-items: center; justify-content: center; padding: 20px;
    }
    .name-overlay[style*="flex"] { display: flex; }
    .name-box { background: #fff; border-radius: 16px; padding: 22px; max-width: 380px; width: 100%; }
    #appLoading {
      position: fixed; inset: 0; background: #f1f5f9; z-index: 1090;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    }
    #appLoading .txt { font-size: 13px; color: #64748b; }
  </style>
</head>
<body>

<div id="appLoading">
  <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading…</span></div>
  <div class="txt" id="appLoadingText">กำลังตรวจสอบสิทธิ์การเข้าใช้งาน...</div>
</div>

<div class="name-overlay" id="authGate" style="display:none;">
  <div class="name-box" id="authGatePanel"></div>
</div>

<div id="app" style="display:none;">

  <div class="hs-navbar">
    <div class="brand">
      <i class="bi bi-sun-fill"></i>
      <span>Hi Solar</span>
      <span class="brand-sub">ทะเบียนลูกค้า</span>
    </div>
    <div class="auth-actions">
      <span class="user-chip" id="userChip">-</span>
      <a href="./home.html" class="icon-btn" title="หน้าแรก"><i class="bi bi-house-door-fill"></i></a>
      <a href="./map.html" class="icon-btn" title="แผนที่ไซต์"><i class="bi bi-geo-alt-fill"></i></a>
      <a href="./link-jobs.html" class="icon-btn" title="ผูกงานเข้าไซต์"><i class="bi bi-link-45deg"></i></a>
      <button class="icon-btn" id="btnSyncDeye" title="ดึงไซต์ใหม่จาก Deye Cloud" style="display:none;"><i class="bi bi-arrow-repeat"></i></button>
      <button class="icon-btn" id="btnPlanner" title="ไปหน้างาน"><i class="bi bi-list-task"></i></button>
      <button class="icon-btn" id="btnLogout" title="ออกจากระบบ"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </div>

  <div class="summary">
    <div class="sum-card"><div class="v" id="sumSites">-</div><div class="l" id="sumSitesLabel">ไซต์ทั้งหมด</div></div>
    <div class="sum-card"><div class="v" id="sumKwp">-</div><div class="l">kWp รวม</div></div>
    <div class="sum-card"><div class="v" id="sumBrands">-</div><div class="l">ยี่ห้อ</div></div>
  </div>

  <div class="ov" id="ov">
    <button class="ov-head" id="ovHead" aria-expanded="false" aria-controls="ovBody">
      <i class="bi bi-bar-chart-line-fill"></i>
      <span class="sp">ภาพรวม <span class="hint">แตะกราฟเพื่อกรองรายการ</span></span>
      <i class="bi bi-chevron-down chev"></i>
    </button>
    <div class="ov-body" id="ovBody">
      <div class="ch">
        <div class="ch-top">
          <div class="ch-t">ปีที่ติดตั้ง <span class="ch-sub">(พ.ศ.)</span></div>
          <div class="metric-tog" id="yearMetric">
            <button data-metric="sites" class="on">ไซต์</button>
            <button data-metric="kwp">kWp</button>
          </div>
        </div>
        <div class="cols" id="chYear"></div>
        <div class="seg-legend" id="chYearLegend"></div>
      </div>

      <div class="ch">
        <div class="ch-top"><div class="ch-t">สถานะประกัน <span class="ch-sub">2 ปีจากวันติดตั้ง</span></div></div>
        <div class="segbar" id="chWarranty"></div>
        <div class="seg-legend" id="chWarrantyLegend"></div>
      </div>

      <div class="ch">
        <div class="ch-top"><div class="ch-t">รอบล้างแผง / ต้องเข้าบริการ</div></div>
        <div class="segbar" id="chService"></div>
        <div class="seg-legend" id="chServiceLegend"></div>

};

}

// ── Warranty / service derivation ─────────────────────
// วันหมดประกันและรอบล้างแผงส่วนใหญ่ยังไม่ถูกกรอกในฐานข้อมูล จึงคำนวณจากวันติดตั้ง
// เป็นค่าเริ่มต้น และให้ค่าที่กรอกไว้จริงชนะเสมอเมื่อมีการกรอกภายหลัง
function parseDate(v) {
  if (!v) return null;
  const d = new Date(String(v).slice(0, 10) + 'T00:00:00');
  return Number.isNaN(d.getTime()) ? null : d;
}
function addMonths(date, months) {
  const d = new Date(date.getTime());
  const target = d.getDate();
  d.setMonth(d.getMonth() + months);
  if (d.getDate() < target) d.setDate(0); // ปลายเดือนไม่ให้ข้ามเดือน
  return d;
}
const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysBetween = (a, b) => Math.round((a.getTime() - b.getTime()) / 86400000);

function codOf(s) { return parseDate(s.grid_connection_date); }

function warrantyExpiryOf(s) {
  const recorded = parseDate(s.warranty_panel_expiry) || parseDate(s.warranty_inverter_expiry);
  if (recorded) return recorded;
  const cod = codOf(s);
  return cod ? addMonths(cod, WARRANTY_YEARS * 12) : null;
}

function warrantyStateOf(s) {
  const exp = warrantyExpiryOf(s);
  if (!exp) return 'unknown';
  const left = daysBetween(exp, startOfToday());
  if (left < 0) return 'expired';
  if (left <= WARRANTY_SOON_DAYS) return 'soon';
  return 'active';
}

function cleanIntervalOf(s) {
  const n = Number(s.clean_interval_months);
  return Number.isFinite(n) && n > 0 ? n : DEFAULT_CLEAN_MONTHS;
}

// ครบรอบถัดไป: ใช้ next_clean_date ถ้าตั้งไว้ ไม่งั้นนับจากการล้างครั้งล่าสุด
// และถ้าไม่เคยมีประวัติล้างเลย ให้นับจากวันติดตั้ง
function serviceOf(s) {
  const explicit = parseDate(s.next_clean_date);
  const lastClean = parseDate(lastCleanBySite[s.id]);
  const base = lastClean || codOf(s);
  const due = explicit || (base ? addMonths(base, cleanIntervalOf(s)) : null);
  if (!due) return { state: 'never', due: null, lastClean: null };
  const left = daysBetween(due, startOfToday());
  const state = left < 0 ? 'overdue' : (left <= CLEAN_SOON_DAYS ? 'soon' : 'ok');
  return { state, due, lastClean };
}

// ── Data ──────────────────────────────────────────────
async function loadSites() {
  const { data, error } = await sb
    .from('hi_solar_sites')
    .select('id,site_code,site_name,customer_name,phone,contact_person,contact_method,address,maps_url,latitude,longitude,capacity_kwp,status,grid_connection_date,platform_code,brand_code,platform_plant_id,total_yield_kwh,warranty_panel_expiry,warranty_inverter_expiry,next_clean_date,clean_interval_months')
    .order('site_name');
  if (error) throw error;
  allSites = data || [];
}

// ประวัติล้างแผงล่าสุดต่อไซต์ ใช้คำนวณรอบถัดไป
// งานที่ยังไม่ถูกผูกเข้าไซต์ (site_id ว่าง) จะไม่นับ — ดูหน้า link-jobs.html
async function loadCleanHistory() {
  const { data, error } = await sb
    .from('hi_solar_jobs')
    .select('site_id,job_date,appointment_date')
    .eq('sheet_key', 'langPaeng')
    .not('site_id', 'is', null);
  if (error) throw error;
  lastCleanBySite = {};
  for (const j of data || []) {
    const when = j.appointment_date || j.job_date;
    if (!when) continue;
    const prev = lastCleanBySite[j.site_id];
    if (!prev || String(when) > String(prev)) lastCleanBySite[j.site_id] = when;
  }
}

async function loadSiteJobs(siteId) {
  const { data, error } = await sb
    .from('hi_solar_jobs')
    .select('id,sheet_key,title,detail,customer_name,job_date,appointment_date,status,technician')
    .eq('site_id', siteId)
    .order('job_date', { ascending: false })
    .limit(20);
  if (error) throw error;
  return data || [];
}

// ── Filtering ─────────────────────────────────────────
// `except` ปล่อยให้แต่ละกราฟไม่กรองด้วยมิติของตัวเอง จึงยังเห็นตัวเลือกอื่นให้สลับได้
function visibleSites(except) {
  const q = searchTerm.trim().toLowerCase();
  return allSites.filter(s => {
    if (except !== 'brand' && brandFilter !== 'ALL' && (s.brand_code || 'none') !== brandFilter) return false;
    if (except !== 'year' && yearFilter !== 'ALL') {
      const cod = codOf(s);
      if (!cod || cod.getFullYear() !== Number(yearFilter)) return false;
    }
    if (except !== 'warranty' && warrantyFilter !== 'ALL' && warrantyStateOf(s) !== warrantyFilter) return false;
    if (except !== 'service' && serviceFilter !== 'ALL' && serviceOf(s).state !== serviceFilter) return false;
    if (!q) return true;
    return [s.site_name, s.address, s.customer_name, s.phone, s.contact_person, s.site_code, s.platform_plant_id]
      .some(v => String(v || '').toLowerCase().includes(q));
  });
}

const hasActiveFilter = () =>
  brandFilter !== 'ALL' || yearFilter !== 'ALL' || warrantyFilter !== 'ALL' ||
  serviceFilter !== 'ALL' || searchTerm.trim() !== '';

// ── Render ────────────────────────────────────────────

// ── Charts ────────────────────────────────────────────
// วาดด้วย CSS/flex ทั้งหมด ไม่พึ่ง chart library เพื่อให้หน้ายังเบา
function renderYearChart() {
  const rows = visibleSites('year');
  const brandsSeen = [...new Set(rows.map(s => s.brand_code || 'none'))]
    .sort((a, b) => (BRAND_LABEL[a] || a).localeCompare(BRAND_LABEL[b] || b));

  const byYear = new Map();
  for (const s of rows) {
    const cod = codOf(s);
    if (!cod) continue;
    const y = cod.getFullYear();
    if (!byYear.has(y)) byYear.set(y, { total: 0, brands: {} });
    const bucket = byYear.get(y);
    const key = s.brand_code || 'none';
    const add = yearMetric === 'kwp' ? (Number(s.capacity_kwp) || 0) : 1;
    bucket.total += add;
    bucket.brands[key] = (bucket.brands[key] || 0) + add;
  }

  const years = [...byYear.keys()].sort((a, b) => a - b);
  const el = document.getElementById('chYear');
  if (!years.length) {
    el.innerHTML = `<div class="ch-note" style="margin:0">ไม่มีข้อมูลวันติดตั้งในรายการที่กรอง</div>`;
    document.getElementById('chYearLegend').innerHTML = '';
    return;
  }
  const max = Math.max(...years.map(y => byYear.get(y).total)) || 1;

  el.innerHTML = years.map(y => {
    const b = byYear.get(y);
    const h = Math.max(3, Math.round((b.total / max) * 82));
    const segs = brandsSeen
      .filter(k => b.brands[k])
      .map(k => `<div class="seg" style="height:${(b.brands[k] / b.total) * 100}%;background:${BRAND_COLOR[k] || BRAND_COLOR.none}"></div>`)
      .join('');
    const on = String(yearFilter) === String(y);
    const dim = yearFilter !== 'ALL' && !on;
    const shown = yearMetric === 'kwp' ? Math.round(b.total).toLocaleString('th-TH') : b.total;
    return `<div class="col ${on ? 'on' : ''} ${dim ? 'dim' : ''}" data-year="${y}" role="button"
      title="ปี ${y + 543} · ${shown}${yearMetric === 'kwp' ? ' kWp' : ' ไซต์'}">
      <div class="cv">${shown}</div>
      <div class="stack" style="height:${h}px">${segs}</div>
      <div class="cl">${y + 543}</div>
    </div>`;
  }).join('');

  document.getElementById('chYearLegend').innerHTML = brandsSeen.map(k =>
    `<button class="lg ${brandFilter === k ? 'on' : ''}" data-brand="${esc(k)}">
      <span class="sw" style="background:${BRAND_COLOR[k] || BRAND_COLOR.none}"></span>${esc(BRAND_LABEL[k] || 'ไม่ระบุ')}
    </button>`
  ).join('');
}

function renderSegChart(opts) {
  const { barId, legendId, meta, rows, stateOf, current, filterKey } = opts;
  const counts = {};
  for (const s of rows) {
    const k = stateOf(s);
    counts[k] = (counts[k] || 0) + 1;
  }
  const keys = Object.keys(meta).filter(k => counts[k]);
  const total = rows.length || 1;

  document.getElementById(barId).innerHTML = keys.map(k => {
    const pct = (counts[k] / total) * 100;
    const dim = current !== 'ALL' && current !== k;
    return `<div class="s ${dim ? 'dim' : ''}" data-${filterKey}="${k}" style="flex:0 0 ${pct}%;background:${meta[k].color}"
      title="${meta[k].label} ${counts[k]} ไซต์">${pct >= 12 ? counts[k] : ''}</div>`;
  }).join('') || `<div class="s" style="flex:1;background:#e2e8f0"></div>`;

  document.getElementById(legendId).innerHTML = keys.map(k =>
    `<button class="lg ${current === k ? 'on' : ''}" data-${filterKey}="${k}">
      <span class="sw" style="background:${meta[k].color}"></span>${meta[k].label} <b>${counts[k]}</b>
    </button>`
  ).join('');
}

function renderBrandKwpChart() {
  const rows = visibleSites('brand');
  const agg = {};
  for (const s of rows) {
    const k = s.brand_code || 'none';
    if (!agg[k]) agg[k] = { kwp: 0, n: 0 };
    agg[k].kwp += Number(s.capacity_kwp) || 0;
    agg[k].n += 1;
  }
  const keys = Object.keys(agg).sort((a, b) => agg[b].kwp - agg[a].kwp);
  const max = Math.max(...keys.map(k => agg[k].kwp), 1);
  document.getElementById('chBrand').innerHTML = keys.map(k => {
    const on = brandFilter === k;
    const dim = brandFilter !== 'ALL' && !on;
    return `<div class="hb ${dim ? 'dim' : ''}" data-brand="${esc(k)}" role="button" title="${esc(BRAND_LABEL[k] || 'ไม่ระบุ')} · ${agg[k].n} ไซต์">
      <div class="hb-l">${esc(BRAND_LABEL[k] || 'ไม่ระบุ')}</div>
      <div class="hb-track"><div class="hb-fill" style="width:${(agg[k].kwp / max) * 100}%;background:${BRAND_COLOR[k] || BRAND_COLOR.none}"></div></div>
      <div class="hb-v">${Math.round(agg[k].kwp).toLocaleString('th-TH')}</div>
    </div>`;
  }).join('');
}

function renderCharts() {
  renderYearChart();
  renderSegChart({
    barId: 'chWarranty', legendId: 'chWarrantyLegend', meta: WARRANTY_META,
    rows: visibleSites('warranty'), stateOf: warrantyStateOf,
    current: warrantyFilter, filterKey: 'warranty',
  });
  const svcRows = visibleSites('service');
  renderSegChart({
    barId: 'chService', legendId: 'chServiceLegend', meta: SERVICE_META,
    rows: svcRows, stateOf: (s) => serviceOf(s).state,
    current: serviceFilter, filterKey: 'service',
  });
  const tracked = svcRows.filter(s => lastCleanBySite[s.id]).length;
  document.getElementById('chServiceNote').textContent = tracked
    ? `นับรอบ ${DEFAULT_CLEAN_MONTHS} เดือนจากการล้างครั้งล่าสุด · มีประวัติล้างแล้ว ${tracked} ไซต์`
    : `ยังไม่มีไซต์ใดมีประวัติล้างแผงที่ผูกไว้ จึงนับรอบ ${DEFAULT_CLEAN_MONTHS} เดือนจากวันติดตั้งก่อน — ผูกงานล้างแผงเข้าไซต์ที่หน้า "ผูกงาน" แล้วตัวเลขจะแม่นขึ้น`;
  renderBrandKwpChart();
}

function renderList() {
  const rows = visibleSites();
  const line = document.getElementById('resultLine');

  line.textContent = rows.length === allSites.length
    ? `${allSites.length} ไซต์ · ${fmtKwp(kwp)} kWp`
    : `พบ ${rows.length} จาก ${allSites.length} ไซต์ · ${fmtKwp(kwp)} kWp`;

  const el = document.getElementById('list');
  if (!rows.length) {
    el.innerHTML = `<div class="empty"><i class="bi bi-search"></i>ไม่พบไซต์ที่ตรงกับเงื่อนไข<br><span class="small">ลองเปลี่ยนคำค้น ตัวกรองยี่ห้อ หรือล้างตัวกรองจากกราฟ</span></div>`;
    return;
  }
  el.innerHTML = rows.map(s => {
    const brand = s.brand_code || 'none';
    const sc = statusClass(s.status);

// ── Maps URL safety ───────────────────────────────────
// Same allowlist as hisolar_planner.html and JDK.html: a pasted maps_url ends up
// in an href, so anything but an https Google Maps link is refused. The inline
// fallback keeps the rule working if job-ui-helpers.js fails to load.
function isAllowedMapsHostname(url) {
  const hostname = String(url?.hostname || '').toLowerCase();
  const pathname = String(url?.pathname || '').toLowerCase();
  if (hostname === 'maps.app.goo.gl') return true;
  if (/^maps\.google\./.test(hostname)) return true;
  if (/^(www\.)?google\./.test(hostname) && pathname.startsWith('/maps')) return true;
  return false;
}

function sanitizeMapsUrlFallback(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';

  let url;
  try {
    url = new URL(raw);
  } catch (_error) {
    return null;
  }

  if (url.protocol !== 'https:') return null;
  if (!isAllowedMapsHostname(url)) return null;

  url.username = '';
  url.password = '';
  return url.toString();
}

function sanitizeMapsUrl(value) {
  if (typeof JOB_UI.sanitizeMapsUrl === 'function') return JOB_UI.sanitizeMapsUrl(value);
  return sanitizeMapsUrlFallback(value);
}

function getMapsValidationMessage(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  return sanitizeMapsUrl(raw)
    ? ''
    : 'ใช้ได้เฉพาะลิงก์ https:// ของ Google Maps หรือ maps.app.goo.gl';
}

// ── Detail sheet ──────────────────────────────────────
const hasCoords = (s) => s.latitude != null && s.longitude != null;

// Same precedence as map.html: a pin captured on site beats a saved link, and
// both beat searching Google Maps for the address text. Many imported addresses
// run words together with no spaces, so the text search is a last resort that
// can land far from the site.
function mapsHref(s) {
  if (hasCoords(s)) return `https://www.google.com/maps/dir/?api=1&destination=${Number(s.latitude)},${Number(s.longitude)}`;
  // Sanitize on the way out too: a row written before this check existed, or by
  // the CSV importer, must not be able to put a javascript: URL in an href.
  const saved = sanitizeMapsUrl(s.maps_url);
  if (saved) return saved;
  if (s.address) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address);
  return null;
}

// How trustworthy the นำทาง button is for this site
function navSourceLabel(s) {
  if (hasCoords(s)) return { text: 'พิกัดจากหน้างาน', exact: true };
  if (sanitizeMapsUrl(s.maps_url)) return { text: 'ลิงก์ Google Maps ที่บันทึกไว้', exact: true };
  if (s.address) return { text: 'ค้นหาจากที่อยู่ — อาจคลาดเคลื่อน', exact: false };
  return { text: 'ยังนำทางไม่ได้', exact: false };
}

function telHref(s) {
  const raw = [s.phone, s.contact_person, s.contact_method]
    .map(v => String(v || '').match(/0\d[\d\s-]{7,}/)?.[0])
    .find(Boolean);
  return raw ? 'tel:' + raw.replace(/[\s-]/g, '') : null;
}

async function saveSiteEdits(s) {
  const msg = document.getElementById('editMsg');
  const saveBtn = document.getElementById('btnSaveSite');
  const cancelBtn = document.getElementById('btnCancelEdit');
  const show = (kind, text) => { msg.className = 'edit-msg ' + kind; msg.textContent = text; };

  const patch = {};
  for (const f of EDIT_FIELDS) {
    const input = document.getElementById('ef_' + f.key);
    if (!input) continue;
    const raw = input.value.trim();
    let next = raw === '' ? null : raw;
    if (next !== null && f.numeric) {
      const n = Number(next);
      if (!Number.isFinite(n) || n <= 0) { show('err', `${f.label} ต้องเป็นตัวเลขมากกว่า 0`); input.focus(); return; }
      next = Math.round(n);
    }
    if (next !== null && f.maps) {
      // Store the sanitized form, so what lands in the database is already safe
      const safe = sanitizeMapsUrl(next);
      if (!safe) { show('err', getMapsValidationMessage(next)); input.focus(); return; }
      next = safe;
    }
    const before = s[f.key] == null ? null : s[f.key];
    if (String(before ?? '') !== String(next ?? '')) patch[f.key] = next;
  }

  if (!Object.keys(patch).length) { show('ok', 'ไม่มีอะไรเปลี่ยน'); return; }

  saveBtn.disabled = cancelBtn.disabled = true;
  saveBtn.textContent = 'กำลังบันทึก…';
  try {
    const { error } = await sb.from('hi_solar_sites').update(patch).eq('id', s.id);
    if (error) throw error;
    // อัปเดตสำเนาในหน้าเลย ไม่ต้องโหลดทะเบียนใหม่ทั้งชุด
    Object.assign(s, patch);
    renderAll();
    renderSitePanel(s);
    const okMsg = document.getElementById('editMsg');
    if (okMsg) { okMsg.className = 'edit-msg ok'; okMsg.textContent = 'บันทึกแล้ว'; }
  } catch (error) {
    saveBtn.disabled = cancelBtn.disabled = false;
    saveBtn.textContent = 'บันทึก';
    // RLS ปฏิเสธจะมาเป็น 403/42501 — บอกให้ชัดว่าเป็นเรื่องสิทธิ์ ไม่ใช่ข้อมูลผิด
    const denied = isAccessDeniedError(error) || /42501|row-level security/i.test(String(error.code || error.message || ''));
    show('err', denied
      ? 'บัญชีนี้ไม่มีสิทธิ์แก้ทะเบียนไซต์ (ต้องเป็น admin หรือ member ของ Hi Solar)'
      : 'บันทึกไม่สำเร็จ: ' + (error.message || error));
  }
}

}

async function startDeyeSync() {
  openSyncSheet(syncSpinner('กำลังอ่านรายชื่อไซต์จาก Deye Cloud…'));
  try {
    const plan = await requestDeyeSync(true);
    const body = document.getElementById('syncBody');
    body.innerHTML = renderSyncPlan(plan);
    document.getElementById('btnSyncCancel').onclick = closeSheet;
    const apply = document.getElementById('btnSyncApply');
    if (apply && !apply.disabled) apply.onclick = applyDeyeSync;
  } catch (error) {
    const body = document.getElementById('syncBody');
    body.innerHTML = `<div class="panel"><div class="edit-msg err" style="display:block">
      อ่านข้อมูลไม่สำเร็จ: ${syncErrorMessage(error)}</div></div>
      <div class="edit-actions"><button class="cancel" id="btnSyncCancel">ปิด</button></div>`;
    document.getElementById('btnSyncCancel').onclick = closeSheet;
  }
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('show');
  document.body.style.overflow = '';
}

// ── Events ────────────────────────────────────────────
function wireEvents() {
  const q = document.getElementById('q');
  const clear = document.getElementById('qClear');
  let t = null;
  q.addEventListener('input', () => {
    clear.style.display = q.value ? 'block' : 'none';
    clearTimeout(t);
    t = setTimeout(() => { searchTerm = q.value; renderAll(); }, 150);
  });
  clear.addEventListener('click', () => {
    q.value = ''; searchTerm = ''; clear.style.display = 'none'; renderAll(); q.focus();
  });

  document.getElementById('brandChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    brandFilter = chip.dataset.brand;
    renderAll();
  });

  // ── Overview panel ──
  const ov = document.getElementById('ov');
  const ovHead = document.getElementById('ovHead');
  if (localStorage.getItem('hsSitesOverview') === 'open') {
    ov.classList.add('open');
    ovHead.setAttribute('aria-expanded', 'true');
  }
  ovHead.addEventListener('click', () => {
    const open = ov.classList.toggle('open');
    ovHead.setAttribute('aria-expanded', open ? 'true' : 'false');
    localStorage.setItem('hsSitesOverview', open ? 'open' : 'closed');
  });

  document.getElementById('yearMetric').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-metric]');
    if (!btn) return;
    yearMetric = btn.dataset.metric;
    [...e.currentTarget.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b === btn));
    renderYearChart();
  });

  // แตะกราฟ = สลับตัวกรองของมิตินั้น (แตะซ้ำที่เดิมเพื่อยกเลิก)
  const toggleFilter = (key, value) => {
    if (key === 'year')     yearFilter     = String(yearFilter) === String(value) ? 'ALL' : value;
    if (key === 'brand')    brandFilter    = brandFilter === value ? 'ALL' : value;
    if (key === 'warranty') warrantyFilter = warrantyFilter === value ? 'ALL' : value;
    if (key === 'service')  serviceFilter  = serviceFilter === value ? 'ALL' : value;
    renderAll();
  };

  document.getElementById('ovBody').addEventListener('click', (e) => {
    const target = e.target.closest('[data-year],[data-brand],[data-warranty],[data-service]');
    if (!target) return;
    const d = target.dataset;
    if (d.year !== undefined)     return toggleFilter('year', d.year);
    if (d.warranty !== undefined) return toggleFilter('warranty', d.warranty);
    if (d.service !== undefined)  return toggleFilter('service', d.service);
    if (d.brand !== undefined)    return toggleFilter('brand', d.brand);
  });

  document.getElementById('activeFilters').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-clear]');
    if (!btn) return;
    const k = btn.dataset.clear;
    if (k === 'year')     yearFilter = 'ALL';
    if (k === 'warranty') warrantyFilter = 'ALL';
    if (k === 'service')  serviceFilter = 'ALL';
    renderAll();
  });

  document.getElementById('list').addEventListener('click', (e) => {
    const card = e.target.closest('.site-card');
    if (card) openSite(card.dataset.id);
  });

  document.getElementById('sheet').addEventListener('click', (e) => {
    if (e.target.id === 'sheet') closeSheet();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('sheet').classList.contains('show')) closeSheet();
  });

  document.getElementById('btnSyncDeye').onclick = startDeyeSync;
  document.getElementById('btnPlanner').onclick = () => { location.href = './hisolar_planner.html'; };
  document.getElementById('btnLogout').onclick = async () => {
    await window.HiSolarAuth.logout('/index.html');
  };
}

function setLoading(visible, text) {
  const el = document.getElementById('appLoading');
  if (text) document.getElementById('appLoadingText').textContent = text;
  el.style.display = visible ? 'flex' : 'none';
}

function redirectToIndex(params = {}) {
  const qs = new URLSearchParams(params).toString();
  location.href = '/index.html' + (qs ? '?' + qs : '');
}

function isAccessDeniedError(err) {
  return err?.status === 403 || /access_denied|forbidden/i.test(String(err?.code || err?.message || ''));
}

// ── Init ──────────────────────────────────────────────
(async function init() {
  setLoading(true, 'กำลังตรวจสอบสิทธิ์การเข้าใช้งาน...');
  wireEvents();

  try {
    const auth = await window.HiSolarAuth.fetchAuthMe('hisolar');
    myRole = String(auth?.membership?.role || '');
    // ปุ่มดึงไซต์เขียนทะเบียน จึงให้เห็นเฉพาะคนที่แก้ทะเบียนได้
    // (การซ่อนปุ่มเป็นแค่ UX ตัวกันจริงคือการเช็ก role ใน /api/sites/sync-deye)
    if (canEditSites()) document.getElementById('btnSyncDeye').style.display = '';
    window.HiSolarAuth.applyUserSummary({
      user: auth?.user || {},
      membership: auth?.membership || {},
      userChipEl: 'userChip',
    });

    setLoading(true, 'กำลังโหลดทะเบียนไซต์...');
    await window.HiSolarAuth.ensureSupabaseClientLoaded();
    await window.HiSolarAuth.refreshSupabaseToken('hisolar', { forceRefresh: true, reason: 'prime' });
    sb = window.HiSolarAuth.createSupabaseClient('hisolar', SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    await loadSites();
    // ประวัติล้างแผงเป็นข้อมูลเสริม ถ้าดึงไม่ได้ก็ยังแสดงทะเบียนได้ตามปกติ
    try {
      await loadCleanHistory();
    } catch (cleanError) {
      console.warn('clean history unavailable', cleanError);
    }
    renderAll();
    document.getElementById('app').style.display = 'block';
  } catch (error) {
    if (error?.status === 401) { redirectToIndex(); return; }
    if (isAccessDeniedError(error)) { redirectToIndex({ reason: 'access_denied' }); return; }
    console.error('sites bootstrap failed', error);
    document.getElementById('list').innerHTML =
      `<div class="empty"><i class="bi bi-exclamation-triangle"></i>โหลดทะเบียนไม่สำเร็จ<br><span class="small">${esc(error.message || error)}</span></div>`;
    document.getElementById('app').style.display = 'block';
  } finally {
    setLoading(false);
  }
})();
</script>
