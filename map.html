<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hi Solar">
  <title>Hi Solar — แผนที่ไซต์</title>

  <link rel="icon" type="image/png" href="icon_hisolar.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --hs-primary:   #16a34a;
      --hs-primary-d: #15803d;
      --hs-amber:     #f59e0b;
      --hs-red:       #ef4444;
      --nav-h:        62px;
      --bs-primary:        #16a34a;
      --bs-primary-rgb:    22,163,74;
    }
    * { font-family: 'Kanit', system-ui, sans-serif; }
    html, body { height: 100%; margin: 0; }
    body { background: #f1f5f9; overflow: hidden; }
    .btn-primary { background-color: var(--hs-primary); border-color: var(--hs-primary); }

    #app { max-width: 480px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; background: #f1f5f9; position: relative; }
    @media (min-width: 576px) { #app { box-shadow: 0 0 40px rgba(0,0,0,.15); } }

    .hs-navbar {
      background: var(--hs-primary); padding: 12px 16px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; z-index: 900;
    }
    .hs-navbar .brand { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 17px; font-weight: 700; }
    .hs-navbar .brand-sub { font-size: 12px; font-weight: 400; opacity: .85; }
    .auth-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn, .nav-link-btn {
      background: rgba(255,255,255,.18); border: 0; color: #fff; text-decoration: none;
      width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 auto;
    }

    /* Map */
    #mapWrap { flex: 1; position: relative; min-height: 0; }
    #map { position: absolute; inset: 0; background: #dbe7de; }
    .leaflet-container { font-family: 'Kanit', system-ui, sans-serif; }

    .map-overlay { position: absolute; z-index: 500; }
    .filters { top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; font-size: 12px; font-weight: 500; border: 1px solid #e2e8f0;
      background: rgba(255,255,255,.96); color: #475569; border-radius: 999px;
      padding: 6px 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(15,23,42,.12);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .chip.on { background: var(--hs-primary); border-color: var(--hs-primary); color: #fff; }
    .chip .cnt { opacity: .7; font-size: 11px; }
    .chip i.sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .gps-btn {
      bottom: 96px; right: 12px; width: 42px; height: 42px; border-radius: 12px;
      background: #fff; border: 1px solid #e2e8f0; display: grid; place-items: center;
      color: #334155; font-size: 18px; box-shadow: 0 4px 14px rgba(15,23,42,.18);
    }

    .pending-bar {
      bottom: 12px; left: 12px; right: 12px; background: #fff; border: 1px solid #e2e8f0;
      border-radius: 14px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(15,23,42,.18);
      display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .pending-bar .pi { width: 34px; height: 34px; border-radius: 10px; background: #fef3c7; color: #b45309; display: grid; place-items: center; flex: 0 0 auto; }
    .pending-bar .pt { flex: 1; min-width: 0; }
    .pending-bar .pt b { font-size: 13px; font-weight: 600; display: block; }
    .pending-bar .pt span { font-size: 11px; color: #64748b; }

    /* pin markers */
    .pin-ico { background: transparent; border: 0; }
    .pin-ico svg { display: block; filter: drop-shadow(0 3px 4px rgba(10,40,30,.4)); }

    /* Sheets */
    .sheet-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 1040; display: none; align-items: flex-end; justify-content: center; }
    .sheet-backdrop.show { display: flex; }
    .sheet { background: #f8fafc; width: 100%; max-width: 480px; max-height: 86vh; border-radius: 18px 18px 0 0; overflow-y: auto; }
    .sheet-hero { background: linear-gradient(150deg, var(--hs-primary), var(--hs-primary-d)); color: #fff; padding: 14px 16px 16px; }
    .sheet-hero .row1 { display: flex; align-items: center; justify-content: space-between; }
    .sheet-hero h2 { font-size: 17px; font-weight: 600; margin: 10px 0 3px; line-height: 1.2; }
    .sheet-hero .loc { font-size: 12px; opacity: .9; }
    .badge-brand { font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: rgba(255,255,255,.9); color: #0f172a; }
    .sheet-body { padding: 14px; }
    .act-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .act {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px; border-radius: 11px; font-size: 12.5px; font-weight: 600;
      border: 1px solid #e2e8f0; background: #fff; color: #334155; text-decoration: none;
    }
    .act.pri { background: var(--hs-primary); border-color: var(--hs-primary); color: #fff; }
    .act.map { background: var(--hs-amber); border-color: var(--hs-amber); color: #422006; }
    .act.disabled { opacity: .45; pointer-events: none; }
    .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 4px 12px; margin-bottom: 12px; }
    .field { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid #f1f5f9; font-size: 13px; }
    .field:first-of-type { border-top: 0; }
    .field .fl { color: #64748b; width: 90px; flex: 0 0 auto; font-size: 12px; }
    .field .fv { font-weight: 500; flex: 1; word-break: break-word; }

    /* pending list */
    .plist { padding: 4px 0; }
    .prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #f1f5f9; cursor: pointer; }
    .prow:first-child { border-top: 0; }
    .prow .pn { flex: 1; min-width: 0; }
    .prow .pn b { font-size: 13px; font-weight: 600; display: block; }
    .prow .pn span { font-size: 11px; color: #64748b; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .search-wrap { position: relative; margin-bottom: 8px; }
    .search-wrap input { width: 100%; border: 1px solid #e2e8f0; border-radius: 11px; padding: 9px 12px 9px 32px; font-size: 13px; }
    .search-wrap .bi-search { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

    /* place mode */
    .place-banner {
      position: absolute; top: 56px; left: 10px; right: 10px; z-index: 600;
      background: #0f172a; color: #fff; border-radius: 12px; padding: 10px 12px;
      font-size: 12.5px; display: none; align-items: center; gap: 10px;
      box-shadow: 0 8px 20px rgba(15,23,42,.3);
    }
    .place-banner.show { display: flex; }
    .place-banner .pb-t { flex: 1; }
    .place-banner .pb-t b { display: block; font-size: 13px; }
    .place-banner .pb-t span { opacity: .8; font-size: 11px; }
    .place-banner button { border: 0; border-radius: 9px; padding: 7px 11px; font-size: 12px; font-weight: 600; }
    .btn-save { background: var(--hs-primary); color: #fff; }
    .btn-cancel { background: rgba(255,255,255,.18); color: #fff; }

    .toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1200; }
    .toast-msg { background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
    .toast-msg.err { background: var(--hs-red); }

    #appLoading { position: fixed; inset: 0; background: #f1f5f9; z-index: 1090; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    #appLoading .txt { font-size: 13px; color: #64748b; }
  </style>
</head>
<body>

<div id="appLoading">
  <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading…</span></div>
  <div class="txt" id="appLoadingText">กำลังตรวจสอบสิทธิ์การเข้าใช้งาน...</div>
</div>

<div id="app" style="display:none;">
  <div class="hs-navbar">
    <div class="brand">
      <i class="bi bi-sun-fill"></i>
      <span>Hi Solar</span>
      <span class="brand-sub">แผนที่ไซต์</span>
    </div>
    <div class="auth-actions">
      <a href="./home.html" class="nav-link-btn" title="หน้าแรก"><i class="bi bi-house-door-fill"></i></a>
      <a href="./sites.html" class="nav-link-btn" title="ทะเบียนลูกค้า"><i class="bi bi-buildings"></i></a>
      <a href="./hisolar_planner.html" class="nav-link-btn" title="งาน"><i class="bi bi-list-task"></i></a>
    </div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>

    <div class="map-overlay filters" id="filters"></div>

    <div class="place-banner" id="placeBanner">
      <div class="pb-t">
        <b id="placeName">—</b>
        <span id="placeHint">แตะบนแผนที่เพื่อวางหมุด หรือกดใช้ตำแหน่งปัจจุบัน</span>
      </div>
      <button class="btn-cancel" id="placeCancel">ยกเลิก</button>
      <button class="btn-save" id="placeSave" disabled>บันทึก</button>
    </div>

    <button class="map-overlay gps-btn" id="gpsBtn" title="ตำแหน่งปัจจุบัน"><i class="bi bi-crosshair"></i></button>

    <div class="map-overlay pending-bar" id="pendingBar" style="display:none;">
      <div class="pi"><i class="bi bi-geo-alt"></i></div>
      <div class="pt">
        <b id="pendingCount">—</b>
        <span>แตะเพื่อเลือกไซต์แล้วปักหมุด</span>
      </div>
      <i class="bi bi-chevron-right text-muted"></i>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="sheet"><div class="sheet" id="sheetInner"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./line-auth-client.js"></script>
<script>
const SUPABASE_URL             = 'https://hlswbazcojsnfibirkzl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Kxzef_y7E3VAmhYvH4eS3g_o3fG7JLn';

// Northern Thailand — where essentially the whole fleet sits.
const HOME = [18.60, 99.00];
const HOME_ZOOM = 9;

const BRAND_LABEL = { HUAWEI:'Huawei', DEYE:'Deye', SOLIS:'Solis', FELICITY:'Felicity', GROWATT:'Growatt' };
const BRAND_COLOR = { HUAWEI:'#dc2626', DEYE:'#2563eb', SOLIS:'#16a34a', FELICITY:'#d97706', GROWATT:'#7c3aed', none:'#64748b' };
const PLATFORM_LABEL = { FUSIONSOLAR:'FusionSolar', SOLARMAN:'Solarman', DEYECLOUD:'Deye Cloud', SOLISCLOUD:'SolisCloud', FSOLAR:'Fsolar', SHINEPHONE:'ShinePhone' };

let sb = null, map = null, markerLayer = null;
let allSites = [];
let brandFilter = 'ALL';
let placing = null;          // { site, marker, latlng }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtKwp = n => n == null ? '-' : Number(n).toLocaleString('th-TH', { minimumFractionDigits:2, maximumFractionDigits:2 });
const hasCoords = s => s.latitude != null && s.longitude != null;

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast-msg' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function pinIcon(color, dim) {
  const svg = `<svg width="${dim?22:28}" height="${dim?28:35}" viewBox="0 0 30 38">
    <path d="M15 0C7 0 1 6 1 14c0 9 14 24 14 24s14-15 14-24C29 6 23 0 15 0z" fill="${color}"/>
    <circle cx="15" cy="14" r="5.5" fill="#fff"/></svg>`;
  return L.divIcon({ className:'pin-ico', html:svg, iconSize:[dim?22:28, dim?28:35], iconAnchor:[dim?11:14, dim?28:35] });
}

// ── Data ──────────────────────────────────────────────
async function loadSites() {
  const { data, error } = await sb.from('hi_solar_sites')
    .select('id,site_code,site_name,customer_name,phone,contact_person,contact_method,address,maps_url,capacity_kwp,status,platform_code,brand_code,latitude,longitude')
    .order('site_name');
  if (error) throw error;
  allSites = (data || []).map(s => ({
    ...s,
    latitude:  s.latitude  == null ? null : Number(s.latitude),
    longitude: s.longitude == null ? null : Number(s.longitude),
  }));
}

async function saveCoords(site, latlng) {
  const { error } = await sb.from('hi_solar_sites')
    .update({ latitude: latlng.lat, longitude: latlng.lng })
    .eq('id', site.id);
  if (error) throw error;
  site.latitude = latlng.lat;
  site.longitude = latlng.lng;
}

// ── Render ────────────────────────────────────────────
function pinned() { return allSites.filter(hasCoords); }

function visible() {
  return pinned().filter(s => brandFilter === 'ALL' || (s.brand_code || 'none') === brandFilter);
}

function renderFilters() {
  const counts = pinned().reduce((a, s) => { const k = s.brand_code || 'none'; a[k] = (a[k]||0)+1; return a; }, {});
  const order = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  const html = [`<button class="chip ${brandFilter==='ALL'?'on':''}" data-brand="ALL">ทั้งหมด <span class="cnt">${pinned().length}</span></button>`];
  for (const b of order) {
    html.push(`<button class="chip ${brandFilter===b?'on':''}" data-brand="${esc(b)}">
      <i class="sw" style="background:${BRAND_COLOR[b]||BRAND_COLOR.none}"></i>${esc(BRAND_LABEL[b]||'ไม่ระบุ')} <span class="cnt">${counts[b]}</span></button>`);
  }
  document.getElementById('filters').innerHTML = html.join('');
}

function renderMarkers(fit) {
  markerLayer.clearLayers();
  const rows = visible();
  for (const s of rows) {
    const color = BRAND_COLOR[s.brand_code || 'none'] || BRAND_COLOR.none;
    L.marker([s.latitude, s.longitude], { icon: pinIcon(color) })
      .addTo(markerLayer)
      .on('click', () => openSite(s.id));
  }
  if (fit && rows.length) {
    map.fitBounds(L.latLngBounds(rows.map(s => [s.latitude, s.longitude])).pad(0.2), { maxZoom: 14 });
  }
}

function renderPendingBar() {
  const n = allSites.length - pinned().length;
  const bar = document.getElementById('pendingBar');
  if (!n) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  document.getElementById('pendingCount').textContent = `ยังไม่มีพิกัด ${n} ไซต์`;
}

// ── Site sheet ────────────────────────────────────────
function mapsHref(s) {
  if (hasCoords(s)) return `https://www.google.com/maps/dir/?api=1&destination=${s.latitude},${s.longitude}`;
  if (s.maps_url) return s.maps_url;
  if (s.address) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address);
  return null;
}
function telHref(s) {
  const raw = [s.phone, s.contact_person, s.contact_method]
    .map(v => String(v||'').match(/0\d[\d\s-]{7,}/)?.[0]).find(Boolean);
  return raw ? 'tel:' + raw.replace(/[\s-]/g,'') : null;
}

function openSite(id) {
  const s = allSites.find(x => String(x.id) === String(id));
  if (!s) return;
  const tel = telHref(s), href = mapsHref(s);
  document.getElementById('sheetInner').innerHTML = `
    <div class="sheet-hero">
      <div class="row1">
        <button class="icon-btn" id="sheetClose"><i class="bi bi-chevron-down"></i></button>
        <span class="badge-brand">${esc(BRAND_LABEL[s.brand_code]||'ไม่ระบุ')} · ${esc(s.site_code||'')}</span>
      </div>
      <h2>${esc(s.site_name)}</h2>
      <div class="loc"><i class="bi bi-geo-alt"></i> ${esc(s.address || 'ยังไม่มีที่อยู่')}</div>
    </div>
    <div class="sheet-body">
      <div class="act-row">
        <a class="act pri ${tel?'':'disabled'}" href="${tel||'#'}"><i class="bi bi-telephone-fill"></i> โทร</a>
        <a class="act map ${href?'':'disabled'}" href="${href||'#'}" target="_blank" rel="noopener"><i class="bi bi-send-fill"></i> นำทาง</a>
      </div>
      <div class="panel">
        <div class="field"><span class="fl">กำลังติดตั้ง</span><span class="fv">${fmtKwp(s.capacity_kwp)} kWp</span></div>
        <div class="field"><span class="fl">แอปติดตาม</span><span class="fv">${esc(PLATFORM_LABEL[s.platform_code]||'-')}</span></div>
        <div class="field"><span class="fl">สถานะ</span><span class="fv">${esc(s.status||'-')}</span></div>
        <div class="field"><span class="fl">พิกัด</span><span class="fv">${hasCoords(s)
          ? `${s.latitude.toFixed(5)}, ${s.longitude.toFixed(5)}`
          : '<span class="text-muted">ยังไม่ได้ปักหมุด</span>'}</span></div>
      </div>
      <button class="act pri w-100" id="btnPlace"><i class="bi bi-pin-map-fill"></i> ${hasCoords(s)?'แก้ไขตำแหน่งหมุด':'ปักหมุดตำแหน่งไซต์'}</button>
    </div>`;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetClose').onclick = closeSheet;
  document.getElementById('btnPlace').onclick = () => { closeSheet(); startPlacing(s); };
}

function openPendingList() {
  const rows = allSites.filter(s => !hasCoords(s));
  document.getElementById('sheetInner').innerHTML = `
    <div class="sheet-hero">
      <div class="row1">
        <button class="icon-btn" id="sheetClose"><i class="bi bi-chevron-down"></i></button>
        <span class="badge-brand">${rows.length} ไซต์</span>
      </div>
      <h2>ไซต์ที่ยังไม่มีพิกัด</h2>
      <div class="loc">เลือกไซต์แล้วปักหมุดจากหน้างาน</div>
    </div>
    <div class="sheet-body">
      <div class="search-wrap"><i class="bi bi-search"></i><input id="pq" placeholder="ค้นหาชื่อ / ที่อยู่…" autocomplete="off"></div>
      <div class="panel"><div class="plist" id="plist"></div></div>
    </div>`;
  const draw = (q='') => {
    const t = q.trim().toLowerCase();
    const f = rows.filter(s => !t || [s.site_name, s.address, s.site_code].some(v => String(v||'').toLowerCase().includes(t)));
    document.getElementById('plist').innerHTML = f.length ? f.slice(0, 60).map(s => `
      <div class="prow" data-id="${esc(s.id)}">
        <div class="pn"><b>${esc(s.site_name)}</b><span>${esc(s.address||'-')}</span></div>
        <i class="bi bi-pin-map text-muted"></i>
      </div>`).join('') + (f.length > 60 ? `<div class="text-muted small pt-2">แสดง 60 จาก ${f.length} — พิมพ์ค้นหาเพื่อกรอง</div>` : '')
      : '<div class="text-muted small py-3">ไม่พบไซต์ที่ตรงกับคำค้น</div>';
  };
  draw();
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetClose').onclick = closeSheet;
  document.getElementById('pq').addEventListener('input', e => draw(e.target.value));
  document.getElementById('plist').addEventListener('click', e => {
    const row = e.target.closest('.prow');
    if (!row) return;
    const s = allSites.find(x => String(x.id) === row.dataset.id);
    closeSheet(); startPlacing(s);
  });
}

function closeSheet() { document.getElementById('sheet').classList.remove('show'); }

// ── Placing mode ──────────────────────────────────────
function startPlacing(site) {
  cancelPlacing();
  placing = { site, marker: null, latlng: hasCoords(site) ? L.latLng(site.latitude, site.longitude) : null };
  document.getElementById('placeName').textContent = site.site_name;
  document.getElementById('placeBanner').classList.add('show');
  document.getElementById('placeSave').disabled = !placing.latlng;
  if (placing.latlng) {
    placing.marker = L.marker(placing.latlng, { icon: pinIcon('#0f172a'), draggable: true }).addTo(map);
    placing.marker.on('dragend', e => { placing.latlng = e.target.getLatLng(); document.getElementById('placeSave').disabled = false; });
    map.setView(placing.latlng, 16);
  } else {
    document.getElementById('placeHint').textContent = 'แตะบนแผนที่เพื่อวางหมุด หรือกด ⌖ ใช้ตำแหน่งปัจจุบัน';
  }
}

function setPlacingPoint(latlng) {
  if (!placing) return;
  placing.latlng = latlng;
  if (placing.marker) placing.marker.setLatLng(latlng);
  else {
    placing.marker = L.marker(latlng, { icon: pinIcon('#0f172a'), draggable: true }).addTo(map);
    placing.marker.on('dragend', e => { placing.latlng = e.target.getLatLng(); });
  }
  document.getElementById('placeSave').disabled = false;
}

function cancelPlacing() {
  if (placing?.marker) map.removeLayer(placing.marker);
  placing = null;
  document.getElementById('placeBanner').classList.remove('show');
  document.getElementById('placeHint').textContent = 'แตะบนแผนที่เพื่อวางหมุด หรือกดใช้ตำแหน่งปัจจุบัน';
}

async function commitPlacing() {
  if (!placing?.latlng) return;
  const btn = document.getElementById('placeSave');
  const { site, latlng } = placing;
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try {
    await saveCoords(site, latlng);
    cancelPlacing();
    renderFilters(); renderMarkers(false); renderPendingBar();
    toast(`บันทึกพิกัด ${site.site_name} แล้ว`);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'บันทึก';
    toast('บันทึกพิกัดไม่สำเร็จ: ' + (e.message || e), true);
  }
}

function locateMe() {
  if (!navigator.geolocation) { toast('อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง', true); return; }
  toast('กำลังหาตำแหน่ง…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
      map.setView(ll, 17);
      if (placing) setPlacingPoint(ll);
    },
    err => toast('หาตำแหน่งไม่สำเร็จ: ' + err.message, true),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ── Init ──────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: false }).setView(HOME, HOME_ZOOM);
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  map.on('click', e => { if (placing) setPlacingPoint(e.latlng); });
}

function wire() {
  document.getElementById('filters').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    brandFilter = chip.dataset.brand;
    renderFilters(); renderMarkers(true);
  });
  document.getElementById('pendingBar').onclick = openPendingList;
  document.getElementById('gpsBtn').onclick = locateMe;
  document.getElementById('placeCancel').onclick = cancelPlacing;
  document.getElementById('placeSave').onclick = commitPlacing;
  document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('sheet').classList.contains('show')) closeSheet();
    else if (placing) cancelPlacing();
  });
}

function setLoading(v, t) {
  if (t) document.getElementById('appLoadingText').textContent = t;
  document.getElementById('appLoading').style.display = v ? 'flex' : 'none';
}
function redirectToIndex(p = {}) {
  const qs = new URLSearchParams(p).toString();
  location.href = '/index.html' + (qs ? '?' + qs : '');
}
const isAccessDenied = e => e?.status === 403 || /access_denied|forbidden/i.test(String(e?.code || e?.message || ''));

(async function init() {
  setLoading(true, 'กำลังตรวจสอบสิทธิ์การเข้าใช้งาน...');
  try {
    await window.HiSolarAuth.fetchAuthMe('hisolar');
    setLoading(true, 'กำลังโหลดแผนที่ไซต์...');
    await window.HiSolarAuth.ensureSupabaseClientLoaded();
    await window.HiSolarAuth.refreshSupabaseToken('hisolar', { forceRefresh: true, reason: 'prime' });
    sb = window.HiSolarAuth.createSupabaseClient('hisolar', SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    await loadSites();
    document.getElementById('app').style.display = 'flex';
    initMap(); wire();
    renderFilters(); renderMarkers(true); renderPendingBar();
    setTimeout(() => map.invalidateSize(), 60);
  } catch (error) {
    if (error?.status === 401) { redirectToIndex(); return; }
    if (isAccessDenied(error)) { redirectToIndex({ reason: 'access_denied' }); return; }
    console.error('map bootstrap failed', error);
    document.getElementById('app').style.display = 'flex';
    toast('โหลดแผนที่ไม่สำเร็จ: ' + (error.message || error), true);
  } finally {
    setLoading(false);
  }
})();
</script>
