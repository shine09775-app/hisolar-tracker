<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi Solar Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --hs-green: #14532d;
      --hs-green-soft: #1f7a46;
      --hs-gold: #f59e0b;
      --hs-ink: #0f172a;
      --hs-surface: rgba(255, 255, 255, 0.92);
      --hs-border: rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Prompt", sans-serif;
      color: var(--hs-ink);
      background:
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.22), transparent 30%),
        radial-gradient(circle at bottom left, rgba(20, 83, 45, 0.18), transparent 34%),
        linear-gradient(145deg, #f8fafc 0%, #eef6f0 48%, #fff8eb 100%);
    }

    .shell {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 460px);
      background: var(--hs-surface);
      border: 1px solid var(--hs-border);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(16px);
      padding: 28px 24px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(20, 83, 45, 0.95), rgba(31, 122, 70, 0.86));
      color: #fff;
      font-size: 1.6rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .brand-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .brand-subtitle {
      color: #475569;
      font-size: 0.92rem;
      margin-top: 2px;
    }

    .status-panel {
      border-radius: 18px;
      padding: 18px;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(15, 23, 42, 0.06);
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .status-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      font-size: 1.35rem;
      background: rgba(20, 83, 45, 0.1);
      color: var(--hs-green);
    }

    .status-title {
      font-size: 1.18rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .status-text {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .status-meta {
      color: #64748b;
      font-size: 0.85rem;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .footer-note {
      margin-top: 18px;
      color: #64748b;
      font-size: 0.8rem;
      text-align: center;
    }

    .btn-line {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 16px;
      font-weight: 600;
      background: #06c755;
      color: #fff;
      box-shadow: 0 14px 30px rgba(6, 199, 85, 0.22);
    }

    .btn-line:hover {
      background: #05b64d;
      color: #fff;
    }

    .btn-ghost {
      width: 100%;
      border-radius: 14px;
      padding: 12px 16px;
      font-weight: 500;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #fff;
      color: var(--hs-ink);
    }

    .spinner-row {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #475569;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="login-card">
      <div class="brand">
        <div class="brand-icon"><i class="bi bi-sun-fill"></i></div>
        <div>
          <h1 class="brand-title">Hi Solar Tracker</h1>
          <div class="brand-subtitle">ทางเข้าเฉพาะทีมงาน Hi Solar</div>
        </div>
      </div>

      <section class="status-panel" id="statusPanel" aria-live="polite">
        <div class="spinner-row">
          <div class="spinner-border spinner-border-sm text-success" role="status" aria-hidden="true"></div>
          <span>กำลังตรวจสอบสิทธิ์เข้าใช้งาน...</span>
        </div>
      </section>

      <div class="footer-note">ระบบจะพาไปยัง LINE Login และตรวจสิทธิ์ก่อนเปิดหน้า planner</div>
    </main>
  </div>

  <script src="./line-auth-client.js"></script>
  <script>
    const panel = document.getElementById('statusPanel');

    function renderState({ icon, title, text, meta, actions }) {
      panel.innerHTML = `
        <div class="status-icon"><i class="${icon}"></i></div>
        <div class="status-title">${title}</div>
        <div class="status-text">${text}</div>
        ${meta ? `<div class="status-meta">${meta}</div>` : ''}
        <div class="d-grid gap-2">
          ${(actions || []).map(action => `
            <button type="button" class="${action.className}" data-action="${action.id}">${action.label}</button>
          `).join('')}
        </div>
      `;
      (actions || []).forEach(action => {
        panel.querySelector(`[data-action="${action.id}"]`)?.addEventListener('click', action.onClick);
      });
    }

    function loginAction() {
      window.HiSolarAuth.startLineLogin('hisolar', '/home.html');
    }

    async function bootstrap() {
      const approval = window.HiSolarAuth.getQueryParam('approval');
      const reason = window.HiSolarAuth.getQueryParam('reason');

      if (approval === 'pending') {
        renderState({
          icon: 'bi bi-hourglass-split',
          title: 'รออนุมัติการเข้าใช้งาน',
          text: 'บัญชี LINE ของคุณเข้าสู่ระบบได้แล้ว แต่ยังไม่มีสิทธิ์เข้าใช้งาน Hi Solar Planner',
          meta: 'เมื่อผู้ดูแลอนุมัติแล้ว ให้กลับมากดเข้าสู่ระบบอีกครั้ง',
          actions: [
            { id: 'retry-login', label: 'เข้าสู่ระบบด้วย LINE อีกครั้ง', className: 'btn-line', onClick: loginAction },
          ],
        });
        return;
      }

      if (reason === 'session_expired') {
        renderState({
          icon: 'bi bi-clock-history',
          title: 'Session หมดอายุ',
          text: 'กรุณาเข้าสู่ระบบใหม่ก่อนใช้งานหน้า Hi Solar Planner',
          actions: [
            { id: 'relogin', label: 'เข้าสู่ระบบด้วย LINE', className: 'btn-line', onClick: loginAction },
          ],
        });
        return;
      }

      try {
        const auth = await window.HiSolarAuth.fetchAuthMe('hisolar');
        if (auth && auth.authenticated) {
          window.location.replace('/home.html');
          return;
        }
      } catch (error) {
        if (error.status === 401) {
          renderState({
            icon: 'bi bi-line',
            title: 'เข้าสู่ระบบสำหรับทีมงาน Hi Solar',
            text: 'ใช้บัญชี LINE ที่ได้รับอนุมัติแล้วเพื่อเข้าใช้งาน planner และติดตามงานภายใน',
            actions: [
              { id: 'line-login', label: 'เข้าสู่ระบบด้วย LINE', className: 'btn-line', onClick: loginAction },
            ],
          });
          return;
        }

        if (error.status === 403 || reason === 'access_denied') {
          renderState({
            icon: 'bi bi-shield-lock',
            title: 'ไม่มีสิทธิ์เข้าใช้งาน',
            text: 'บัญชีนี้ยังไม่สามารถเปิด Hi Solar Planner ได้',
            meta: 'ถ้าคุณควรมีสิทธิ์ ให้ผู้ดูแลตรวจสอบ membership ของระบบ Hi Solar',
            actions: [
              { id: 'line-login', label: 'ลองเข้าสู่ระบบอีกครั้ง', className: 'btn-line', onClick: loginAction },
            ],
          });
          return;
        }

        renderState({
          icon: 'bi bi-wifi-off',
          title: 'เชื่อมต่อระบบไม่สำเร็จ',
          text: 'ไม่สามารถตรวจสอบสิทธิ์ได้ในขณะนี้',
          meta: error && error.message ? error.message : '',
          actions: [
            { id: 'retry', label: 'ลองใหม่', className: 'btn-ghost', onClick: () => window.location.reload() },
            { id: 'login', label: 'เข้าสู่ระบบด้วย LINE', className: 'btn-line', onClick: loginAction },
          ],
        });
      }
    }

    bootstrap();
  </script>
</body>
</html>
